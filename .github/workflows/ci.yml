name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  # Stacked PRs target topic branches until their predecessors reach main.
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check

  compat-min-supported:
    name: Compat - min supported (peer floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Re-pin pi packages to minimum supported version
        # Floor is read from package.json peerDependencies (single source of
        # truth) — it only moves when new Pi APIs are adopted, never weekly.
        run: |
          for pkg in pi-agent-core pi-ai pi-coding-agent pi-tui; do
            FLOOR=$(node -p "require('./package.json').peerDependencies['@earendil-works/${pkg}'].match(/>=([^ ]+)/)[1]")
            echo "compat floor for @earendil-works/${pkg}: ${FLOOR}"
            pnpm add -D "@earendil-works/${pkg}@${FLOOR}" --save-exact
          done
      - run: pnpm typecheck
      - run: pnpm test

  fallow-audit:
    if: github.event_name == 'pull_request'
    name: Fallow - changed-code audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: fallow-rs/fallow@df046c1a0f4192ebbd9db705f9aead8e4ebf4ef3 # v3.11.0
        continue-on-error: true
        with:
          command: audit
          format: compact
          comment: true
          review-comments: true
          sarif: false
